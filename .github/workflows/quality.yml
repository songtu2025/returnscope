name: quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-prototype/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check web_backend return_semantics return_analysis tests
      - run: python -m ruff format --check web_backend return_semantics return_analysis tests
      - run: python -m pytest tests -q
      - run: npm ci
        working-directory: web-prototype
      - run: npm run quality
        working-directory: web-prototype
