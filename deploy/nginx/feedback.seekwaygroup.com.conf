limit_req_zone $binary_remote_addr zone=feedback_login_per_ip:10m rate=5r/m;

map $uri $feedback_cache_control {
    default "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}

upstream user_feedback_semantics_app {
    server 127.0.0.1:18082;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name feedback.seekwaygroup.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name feedback.seekwaygroup.com;

    ssl_certificate /etc/letsencrypt/live/feedback.seekwaygroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feedback.seekwaygroup.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 210m;
    server_tokens off;
    limit_req_status 429;

    add_header Cache-Control $feedback_cache_control always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/auth/login {
        limit_req zone=feedback_login_per_ip burst=5 nodelay;
        proxy_pass http://user_feedback_semantics_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
    }

    location / {
        proxy_pass http://user_feedback_semantics_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
    }
}
