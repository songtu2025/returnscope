[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["tmp", "runtime", "output", "web-prototype"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-args = 5
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B017"]
"scripts/generate_sk001_gold_sample.py" = ["E402"]
"scripts/run_return_semantics.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["web_backend", "return_semantics", "return_analysis"]
check_untyped_defs = true
show_error_codes = true
warn_unused_configs = true
